[project]
name = "credx-backend"
version = "0.1.0"
description = "Modular CredX authentication API"
requires-python = ">=3.14,<3.15"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.34,<1",
    "sqlalchemy>=2.0,<3",
    "alembic>=1.14,<2",
    "pydantic-settings>=2.7,<3",
    "email-validator>=2.2,<3",
    "PyJWT>=2.10,<3",
    "pwdlib[argon2]>=0.2,<1",
    "python-multipart>=0.0.9",
    "pandas>=2.0",
    "numpy>=2.0",
    "scikit-learn>=1.5",
    "xgboost>=2.0",
    "joblib>=1.3",
    "openpyxl>=3.1",
    "openai>=1.0",
]

[dependency-groups]
dev = ["pytest>=8,<10", "httpx2>=2,<3", "ruff>=0.11,<1", "pip-audit>=2.8,<3"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pyright]
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = ["error"]

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
