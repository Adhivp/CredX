[project]
name = "credx-backend"
version = "0.1.0"
description = "Modular CredX authentication API"
requires-python = ">=3.11,<3.14"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.34,<1",
    "sqlalchemy>=2.0,<3",
    "alembic>=1.14,<2",
    "pydantic-settings>=2.7,<3",
    "email-validator>=2.2,<3",
    "PyJWT>=2.10,<3",
    "pwdlib[argon2]>=0.2,<1",
]

[dependency-groups]
dev = ["pytest>=8,<10", "httpx2>=2,<3", "ruff>=0.11,<1", "pip-audit>=2.8,<3"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pyright]
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = ["error"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
